<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Word Lab – Pioneers</title>
<style>
@font-face{font-family:Andika;src:url(../fonts/Andika-Regular.ttf)}
@font-face{font-family:Andika;font-weight:700;src:url(../fonts/Andika-Bold.ttf)}
:root{--o:#f47817;--t:#68ccd1;--ink:#222230;--ok:#3a9d3a;--v:#e8231f;--c:#1d4fd8}
*{box-sizing:border-box}
body{margin:0;font-family:Andika,"Segoe UI",sans-serif;color:var(--ink);background:#fff8f0;text-align:center}
.wrap{max-width:960px;margin:0 auto;padding:10px 12px 16px}
.top{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.lab{font-size:15px;font-weight:700;color:#fff;background:var(--o);border-radius:999px;padding:4px 12px}
.dots{display:flex;gap:6px}.dots span{width:34px;height:34px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .3s}
.dots span.on{background:#ffe9a8;transform:scale(1.1)}.dots span.cur{outline:3px solid var(--t)}
.tiles{display:flex;justify-content:center;gap:12px;margin:14px 0 8px}
.tile{width:min(120px,22vw);height:min(140px,26vw);border-radius:22px;border:0;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.12);font:inherit;font-weight:700;font-size:min(96px,18vw);line-height:1;cursor:pointer;color:var(--c);transition:transform .15s}
.tile.v{color:var(--v)}
.tile.lit{background:#eaf4ff;transform:translateY(-6px)}
.tile.v.lit{background:#ffe9e7}
.tile.glow{background:#ffe9e7;box-shadow:0 0 0 6px #ffb3ad,0 6px 0 rgba(0,0,0,.12);animation:pp .5s cubic-bezier(.3,1.7,.5,1)}
.tile.shake{animation:sh .45s}
@keyframes sh{20%{transform:translateX(-8px) rotate(-4deg)}60%{transform:translateX(8px) rotate(4deg)}}
@keyframes pp{0%{transform:scale(.8)}100%{transform:scale(1)}}
.step{display:none}.step.on{display:block;animation:pp .35s}
h2{margin:6px 0 4px;font-size:min(26px,5.4vw)}
.say{font-size:min(22px,4.6vw);font-weight:700;min-height:32px;margin:6px 0}
.say b{color:var(--v)}
.fingers{font-size:44px;min-height:54px;letter-spacing:4px}
.btn{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:999px;padding:10px 24px;cursor:pointer;color:#fff;background:var(--o);box-shadow:0 4px 0 #c85d0b;margin:6px}
.btn.alt{background:var(--t);box-shadow:0 4px 0 #3fa3a8}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.15);border:2px solid #ddd}
.mean{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:6px}
.pic{background:#fff;border-radius:24px;padding:10px;box-shadow:0 4px 12px rgba(0,0,0,.08);cursor:pointer;border:0}
.pic img{width:min(220px,40vw);height:auto;display:block}
.def{max-width:440px;text-align:left;font-size:24px;line-height:1.35;cursor:pointer;background:#fff;border-left:6px solid var(--t);border-radius:12px;padding:12px 16px;display:none}
.qs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.q{background:#fff;border:2px solid #e2e2ea;border-radius:16px;padding:6px 12px;font-size:16px}
.sent{font-size:min(30px,6vw);font-weight:700;background:#fff;border-radius:20px;padding:14px 20px;display:none;box-shadow:0 4px 12px rgba(0,0,0,.08);margin:10px auto;max-width:720px}
.sent b{color:var(--v);text-decoration:underline}
.done{font-size:min(30px,6vw);font-weight:700}
/* write */
.how{max-width:420px;margin:0 auto 6px;cursor:zoom-in;border-radius:14px}
.how.big{max-width:900px;cursor:zoom-out}
.line{position:relative;background:#fff;border-radius:16px;box-shadow:0 3px 10px rgba(0,0,0,.07);margin:10px auto;max-width:900px}
.line canvas{display:block;width:100%;height:150px;touch-action:none;border-radius:16px}
.line .ctl{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.line .ctl button{font:inherit;font-size:14px;border:0;border-radius:999px;padding:5px 10px;cursor:pointer;background:#f1f1f5}
.line .ctl button.star{background:#fff3c4}
.line .n{position:absolute;left:10px;top:8px;font-weight:700;color:#bbb}
.pens{display:flex;gap:8px;justify-content:center;margin:4px 0}
.pen{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #ccc;cursor:pointer}
.pen.on{box-shadow:0 0 0 3px var(--ink)}
.conf{position:fixed;top:-20px;font-size:28px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.tile.silent{opacity:.6;border-style:dashed;background:#fdf2f7;color:#e0457b}.tile.pk{color:#e0457b}.tiles.spl{padding-top:56px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const P=new URLSearchParams(location.search);const LES=P.get('l')||'short-a';const W=(P.get('w')||'hat').toLowerCase();const MODE=P.get('mode')||'learn';
const $=id=>document.getElementById(id);
let cur=null;function play(src){return new Promise(r=>{if(cur)cur.pause();cur=new Audio(src);cur.onended=cur.onerror=r;cur.play().catch(r)})}
let ac;function beep(f,d,type='triangle',v=.12){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function confetti(){const em=['🎉','⭐','🎊','✨','🌟'];for(let k=0;k<36;k++){const s=document.createElement('div');s.className='conf';s.textContent=em[k%em.length];s.style.left=Math.random()*100+'vw';s.style.animationDuration=(1.6+Math.random()*1.6)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3600)}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('data/'+LES+'.json',{cache:'no-store'}).then(r=>r.json()).then(D=>{const X=D.words.find(x=>x.word===W)||D.words[0];(MODE==='write'?write:learn)(D,X)});

function learn(D,X){const app=$('app');const target=D.target;const segs=X.segs;const SPL=!!target.split;const TL=target.letters||[target.letter],isT=x=>TL.includes(x),LT=target.letter,aIdx=segs.findIndex(isT),eIdx=SPL?segs.length-1:-1;const NS=SPL?segs.length-1:segs.length;const hit=new Set();
 app.innerHTML=`<div class="top"><span class="lab">🔤 WORD LAB</span><div class="dots" id="dots">${['👆','🔍','💬','🗣️'].map(e=>`<span>${e}</span>`).join('')}</div></div>
 <div class="tiles ${SPL?'spl':''}" id="tiles">${segs.map((s,i)=>`<button class="tile ${(SPL?(i===aIdx):isT(s))?'v':''} ${i===eIdx?'silent':''}" data-i="${i}">${esc(s)}</button>`).join('')}</div>
 <div class="step on" id="s0"><h2 id="h0">👆 Round 1: Sound it out! Tap each sound as you say it.</h2><div class="fingers" id="fing"></div><div class="say" id="say0">Put your fingers up and get ready…</div><button class="btn alt" id="r2" style="display:none">🔁 Round 2: tap again and check ➜</button></div>
 <div class="step" id="s1"><h2>🔍 ${SPL?`Which <b>two letters</b> work together to make the <span style="color:var(--v)">${esc(target.name)}</span> sound? Tap them both!`:(target.noun==='letters'?`Which <b>letters</b> work together to make the <span style="color:var(--v)">${esc(target.name)}</span> sound? Tap them!`:`Which letter makes the <span style="color:var(--v)">${esc(target.name)}</span> sound? Tap it!`)}</h2><div class="say" id="say1"></div></div>
 <div class="step" id="s2"><h2>💬 What does <b>${esc(X.word)}</b> mean?</h2>
   <div class="mean"><button class="pic" id="pic" title="Hear the word"><img src="img/${X.word}.jpg" alt="${esc(X.word)}"><div style="font-size:15px;color:#777">🔊 tap to hear</div></button><div class="def" id="def">${esc(X.def)} <span style="font-size:18px">🔊</span></div></div>
   <button class="btn alt" id="showdef">📖 Show the meaning</button>
   <div class="qs">${(X.ask||[]).map(q=>`<span class="q">💭 ${esc(q)}</span>`).join('')}</div>
   <button class="btn" id="go3">Next ➜</button></div>
 <div class="step" id="s3"><h2>🗣️ Can you make a sentence with <b>${esc(X.word)}</b>?</h2>
   <div class="sent" id="sent">${esc(X.sentence).replace(new RegExp('\\b'+X.word+'\\b','i'),m=>'<b>'+m+'</b>')}</div>
   <button class="btn alt" id="showsent">👀 Show an example</button> <button class="btn" id="fin">I did it! ⭐</button>
   <div class="done" id="done"></div></div>`;
 const tiles=[...document.querySelectorAll('.tile')];let step=0,tapped=0,round=1;
 const dots=[...$('dots').children];const setStep=n=>{step=n;[0,1,2,3].forEach(i=>{$('s'+i).classList.toggle('on',i===n);dots[i].classList.toggle('cur',i===n)});dots.forEach((d,i)=>d.classList.toggle('on',i<n))};setStep(0);
 tiles.forEach((t,i)=>t.onclick=()=>{
  if(step===0){if(SPL&&i===eIdx){t.classList.add('shake');setTimeout(()=>t.classList.remove('shake'),450);$('say0').innerHTML='Shh… the <b style="color:#e0457b">e</b> is silent! Only tap the sounds you can hear.';return}
   if(i!==tapped){t.classList.add('shake');setTimeout(()=>t.classList.remove('shake'),450);return}
   t.classList.add('lit');tapped++;if(isT(segs[i]))play(target.sound);else beep(440+i*80,.12);
   if(round===1){$('say0').innerHTML=tapped<NS?'Keep going…':'How many sounds did you say? Tell your tutor! 🗣️';if(tapped===NS)$('r2').style.display='inline-block';return}
   $('fing').textContent='☝️'.repeat(tapped);$('say0').innerHTML=tapped<NS?`${tapped} sound${tapped>1?'s':''}…`:(SPL?`<b>${X.word}</b> has <b>${segs.length}</b> letters but only <b>${NS}</b> sounds! The <b style="color:#e0457b">e</b> is silent. 🎉`:`<b>${X.word}</b> has <b>${segs.length}</b> sounds! 🎉`);
   if(tapped===NS)setTimeout(()=>{tiles.forEach(x=>x.classList.remove('lit'));setStep(1)},SPL?2200:1500)}
  else if(step===1&&SPL){if(i===aIdx||i===eIdx){if(hit.has(i))return;hit.add(i);t.classList.add('glow');beep(660+hit.size*120,.12);
    if(hit.size===2){play(target.sound);loopArc();$('say1').innerHTML=`Yes! The bossy <b style="color:#e0457b">e</b> makes the <b>${LT}</b> say its name in <b>${X.word}</b>! ⭐`;[660,880].forEach((f,k)=>setTimeout(()=>beep(f,.15),k*90));setTimeout(()=>setStep(2),2600)}
    else $('say1').innerHTML=`Good! Now find its partner…`}
   else{t.classList.add('shake');setTimeout(()=>t.classList.remove('shake'),450);beep(220,.18,'sawtooth',.05);$('say1').innerHTML=`Good try! Look for the <b>${LT}</b> and the bossy <b>e</b> on the end: ${segs.map((s,k)=>(k===aIdx||k===eIdx)?'<b>'+s+'</b>':s).join('-')}`}}
  else if(step===1){if(isT(segs[i])){t.classList.add('glow');play(target.sound);[660,880].forEach((f,k)=>setTimeout(()=>beep(f,.15),k*90));$('say1').innerHTML=`Yes! <b>${esc(segs[i])}</b> makes the ${esc(target.name)} sound in <b>${X.word}</b>! ⭐`;setTimeout(()=>setStep(2),1600)}
   else{t.classList.add('shake');setTimeout(()=>t.classList.remove('shake'),450);beep(220,.18,'sawtooth',.05);$('say1').innerHTML=`Good try! Listen again: ${segs.map(s=>isT(s)?'<b>'+s+'</b>':s).join('-')}`}}
  else if(SPL?i===aIdx:isT(segs[i]))play(target.sound)});
 function loopArc(){const c=$('tiles');c.style.position='relative';const cr=c.getBoundingClientRect(),a=tiles[aIdx].getBoundingClientRect(),e=tiles[eIdx].getBoundingClientRect();const x1=e.left+e.width/2-cr.left,x2=a.left+a.width/2-cr.left,y=a.top-cr.top;
  c.insertAdjacentHTML('beforeend',`<svg style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible"><path d="M${x1} ${y} C ${x1} ${y-84}, ${x2} ${y-84}, ${x2} ${y-6}" fill="none" stroke="#e0457b" stroke-width="6" stroke-linecap="round" stroke-dasharray="700" stroke-dashoffset="700"><animate attributeName="stroke-dashoffset" to="0" dur=".9s" fill="freeze"/></path><path d="M${x2-11} ${y-16} L${x2} ${y-3} L${x2+11} ${y-16}" fill="none" stroke="#e0457b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`)}
 $('r2').onclick=()=>{round=2;tapped=0;tiles.forEach(x=>x.classList.remove('lit'));$('r2').style.display='none';$('fing').textContent='';$('h0').textContent='👆 Round 2: Tap each sound again and watch the sounds add up!';$('say0').innerHTML='Put your fingers up and get ready…'};
 $('pic').onclick=()=>play('audio/'+X.word+'.mp3');
 $('showdef').onclick=()=>{$('def').style.display='block';$('showdef').style.display='none';play('audio/'+X.word+'-def.mp3')};
 $('def').onclick=()=>play('audio/'+X.word+'-def.mp3');
 $('go3').onclick=()=>setStep(3);
 $('showsent').onclick=()=>{$('sent').style.display='block';$('showsent').style.display='none'};
 $('fin').onclick=()=>{dots.forEach(d=>d.classList.add('on'));$('done').textContent=`Amazing! You learnt the word ${X.word}! 🌟`;confetti();[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.2),k*110))};
}

function write(D,X){const app=$('app');
 app.innerHTML=`<div class="top"><span class="lab">✏️ WRITING PAD</span></div>
 <h2>Write <b style="color:var(--v)">${esc(X.word)}</b> three times, then ${D.target.split?`draw a loop from the bossy <b>e</b> back to the <b>${esc(D.target.letter)}</b>!`:`underline the ${D.target.noun==='letters'?'letters that make':'letter that makes'} the ${esc(D.target.name)} sound!`}</h2>
 ${X.hasWriteImg?`<img class="how" id="how" src="img/${X.word}-write.jpg" alt="How to write it" title="Tap to zoom">`:''}
 <div class="pens" id="pens">${['#222230','#1d4fd8','#e8231f','#3a9d3a','#7c4dff'].map((c,i)=>`<span class="pen ${i?'':'on'}" data-c="${c}" style="background:${c}"></span>`).join('')}</div>
 ${[1,2,3].map(n=>`<div class="line"><span class="n">${n}</span><canvas data-n="${n}"></canvas><div class="ctl"><button class="clr">🧽 Clear</button><button class="star">⭐ Done</button></div></div>`).join('')}
 <div class="done" id="done"></div>`;
 if($('how'))$('how').onclick=()=>$('how').classList.toggle('big');
 let color='#222230';document.querySelectorAll('.pen').forEach(p=>p.onclick=()=>{document.querySelectorAll('.pen').forEach(q=>q.classList.remove('on'));p.classList.add('on');color=p.dataset.c});
 let stars=0;
 document.querySelectorAll('.line').forEach(L=>{const cv=L.querySelector('canvas'),n=+cv.dataset.n,cx=cv.getContext('2d');let strokes=[];
  function size(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;cx.setTransform(dpr,0,0,dpr,0,0);guide(r.width,r.height);strokes.forEach(s=>draw(s))}
  function guide(w,h){cx.clearRect(0,0,w,h);const top=h*.2,mid=h*.48,base=h*.78;cx.lineWidth=2;cx.strokeStyle='#9fd3e6';[top,base].forEach(y=>{cx.beginPath();cx.moveTo(10,y);cx.lineTo(w-10,y);cx.stroke()});cx.setLineDash([8,8]);cx.strokeStyle='#c9e6ef';cx.beginPath();cx.moveTo(10,mid);cx.lineTo(w-10,mid);cx.stroke();cx.setLineDash([]);
   if(n<3){const fs=(base-top)*1.38;cx.font=`700 ${fs}px Andika`;cx.textBaseline='alphabetic';cx.setLineDash([6,8]);cx.lineWidth=2.5;cx.strokeStyle=n===1?'#b9b9c6':'#dcdce4';cx.strokeText(X.word,60,base);cx.setLineDash([])}}
  function draw(s){cx.strokeStyle=s.c;cx.lineWidth=7;cx.lineCap='round';cx.lineJoin='round';cx.beginPath();s.p.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));cx.stroke()}
  let curS=null;const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);curS={c:color,p:[pos(e)]};strokes.push(curS)});
  cv.addEventListener('pointermove',e=>{if(!curS)return;curS.p.push(pos(e));draw({c:curS.c,p:curS.p.slice(-2)})});
  cv.addEventListener('pointerup',()=>curS=null);cv.addEventListener('pointerleave',()=>curS=null);
  L.querySelector('.clr').onclick=()=>{strokes=[];size()};
  L.querySelector('.star').onclick=e=>{const b=e.currentTarget;if(b.dataset.done)return;b.dataset.done=1;b.textContent='🌟 Great!';stars++;beep(660+stars*110,.18);if(stars===3){$('done').textContent=`3 out of 3! Beautiful writing! ✏️🌟`;confetti()}};
  document.fonts.load('700 40px Andika').then(size);window.addEventListener('resize',size)});
}
</script>
</body>
</html>
