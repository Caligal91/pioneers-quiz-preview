<html lang="en-AU">

<title>Meet the letter – Pioneers</title>
<style>
@font-face{font-family:Andika;src:url(../fonts/Andika-Regular.ttf)}
@font-face{font-family:Andika;font-weight:700;src:url(../fonts/Andika-Bold.ttf)}
:root{--o:#f47817;--t:#68ccd1;--ink:#222230;--v:#e8231f}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Andika,"Segoe UI",sans-serif;color:var(--ink);text-align:center;overflow-x:hidden;

h1{margin:12px 0 0;font-size:min(30px,5.5vw)}
.stage{display:flex;justify-content:center;align-items:flex-end;gap:min(30px,3vw);margin-top:4px}

.av img{width:132px;display:block}
.mw{position:relative;display:inline-block;line-height:0}

.mw.shut .lip{opacity:1}
.talk img{transform-origin:50% 90%}
.d1{animation:d1 .9s ease}.d2{animation:d2 1.1s ease}
@keyframes d1{0%{transform:none}15%{transform:translateY(-40px) rotate(-10deg)}30%{transform:translateY(0) rotate(8deg)}45%{transform:translateY(-28px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg) scaleY(.92)}80%{transform:scaleY(1.05)}100%{transform:none}}
@keyframes d2{0%{transform:none}20%{transform:scale(1.15,.85)}40%{transform:translateY(-55px) rotate(180deg) scale(1.1)}60%{transform:translateY(-55px) rotate(360deg) scale(1.1)}80%{transform:translateY(0) scale(.9,1.1)}100%{transform:none}}
.pupil{animation:look 5s infinite}
@keyframes look{0%,20%{transform:translate(0,0)}25%,45%{transform:translate(-5px,2px)}50%,70%{transform:translate(5px,1px)}75%,100%{transform:translate(0,0)}}
.lid{transform-origin:center;transform-box:fill-box;animation:blink 4.5s infinite}
@keyframes blink{0%,46%,52%,100%{transform:scaleY(0)}49%{transform:scaleY(1)}}
.mouth-open{display:none}.talk .mouth-open{display:inline}.talk .mouth-shut{display:none}
.feet{animation:tap 1.4s infinite}

.bossy.on{display:block}
.bt{display:flex;justify-content:center;gap:8px;align-items:center;min-height:84px}
.bt .tl{width:62px;height:76px;border-radius:14px;background:#fff8f0;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:46px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.bt .tl.a{border-color:var(--v);color:var(--v)}
.bt .tl.e{background:#ffe9f1;border-color:#e0457b;color:#e0457b;animation:ein .7s cubic-bezier(.3,1.6,.5,1)}
.bt .tl.long{animation:lg .8s ease}
@keyframes ein{from{transform:translateX(120px) scale(.2) rotate(40deg);opacity:0}to{transform:none;opacity:1}}
@keyframes lg{30%{transform:translateY(-22px) scale(1.2)}60%{transform:translateY(0) scale(.95)}}
.bnote{font-size:18px;font-weight:700;min-height:28px;margin:4px 0 8px}
.bsm{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:999px;padding:9px 20px;cursor:pointer;color:#fff;background:#e0457b;box-shadow:0 4px 0 #b02e5c;margin:2px 4px}
.bsm.alt{background:var(--t);box-shadow:0 4px 0 #3fa3a8}
.fly{position:fixed;font-size:32px;pointer-events:none;animation:fly 1.2s ease-out forwards;z-index:20}
@keyframes fly{to{transform:translate(var(--dx),-160px) rotate(var(--r));opacity:0}}
.ov{position:fixed;inset:0;background:rgba(20,20,35,.55);display:none;align-items:center;justify-content:center;z-index:9}
.ov.on{display:flex}
.phone{width:300px;height:590px;max-height:96vh;background:#1e1e2a;border-radius:44px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.phone.ring{animation:ring .25s infinite}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.scr{height:100%;border-radius:32px;background:linear-gradient(#68ccd1,#7c4dff);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:18px 12px 16px;color:#fff;overflow:hidden}
.who{font-size:24px;font-weight:700}.st{font-size:16px;opacity:.9}
.av{width:150px;height:150px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;transition:transform .3s}
.av svg{width:118px;overflow:visible}
.av.calling{transform:scale(.75)}
.cap{min-height:50px;font-size:17px;font-weight:700;background:rgba(0,0,0,.25);border-radius:14px;padding:6px 10px;width:100%}
.pad{display:flex;gap:14px;justify-content:center}
.key{width:96px;height:96px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.key b{font-size:40px;line-height:1}.key span{font-size:13px;font-weight:700}
.key:disabled{opacity:.35}
.key.press{animation:press .25s}
@keyframes press{50%{transform:scale(.88);background:#ffe1c4}}
.hang{width:62px;height:62px;border-radius:50%;border:0;background:#e0302f;color:#fff;font-size:28px;cursor:pointer;transform:rotate(135deg)}
</style>
</head>
<body>
<h1 id="h">Meet the letter a! Tap me!</h1>
<div class="stage">
  <button class="mon" id="big" aria-label="big letter"></button>
  <button class="mon" id="small" aria-label="small letter"></button>
</div>
<div class="bubble" id="say">👆 Tap a monster to hear its sound!</div>
<div class="row">

</div>
<div class="bossy" id="bossy"><div class="bt" id="bt"></div><div class="bnote" id="bnote">Tap the button to add the bossy <b style="color:#e0457b">e</b>!</div><button class="bsm" id="badd">➕ Add the bossy e!</button><button class="bsm alt" id="bnext">🔁 Try another word</button></div>
<p class="tip" id="tip">Tap a monster to meet it, then tap again for its <b>short</b> and <b>long</b> sounds. Tap the picture to hear the word.</p>

<div class="ov" id="ov"><div class="phone" id="phone"><div class="scr">
  <div><div class="who" id="who">Letter a</div><div class="st" id="st">Calling…</div></div>
  <div class="av calling" id="av"></div>
  <div class="cap" id="cap"></div>
  <div class="pad"><button class="key" id="k1" disabled><b>1</b><span>short</span></button><button class="key" id="k2" disabled><b>2</b><span>long</span></button></div>
  <button class="hang" id="hang" title="Hang up">📞</button>
</div></div></div>

<svg width="0" height="0" style="position:absolute"><defs>
 <filter id="fur" x="-25%" y="-25%" width="150%" height="150%"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="28" xChannelSelector="R" yChannelSelector="G"/></filter>
 <filter id="fur2" x="-25%" y="-25%" width="150%" height="150%"><feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="1" seed="8" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs></svg>

<script>
const P=new URLSearchParams(location.search);const L=(P.get('l')||'a').toLowerCase();const W=(P.get('w')||'cat').toLowerCase();
const F=P.get('f')==='long',TEAM=P.get('f')==='team';const DL=P.get('d');let CFG=null;

 return `<svg viewBox="0 0 300 340">
 <g class="feet"><ellipse cx="110" cy="318" rx="34" ry="16" fill="${dark}" filter="url(#fur2)"/><ellipse cx="190" cy="318" rx="34" ry="16" fill="${dark}" filter="url(#fur2)"/></g>
 <text x="150" y="300" text-anchor="middle" font-family="Andika" font-weight="700" font-size="${fs}" fill="${dark}" stroke="${dark}" stroke-width="34" stroke-linejoin="round" filter="url(#fur)">${ch}</text>
 <text x="150" y="300" text-anchor="middle" font-family="Andika" font-weight="700" font-size="${fs}" fill="${c}" stroke="${c}" stroke-width="18" stroke-linejoin="round" filter="url(#fur2)">${ch}</text>
 <text x="150" y="300" text-anchor="middle" font-family="Andika" font-weight="700" font-size="${fs}" fill="${light}" opacity=".35" transform="translate(-4,-6)">${ch}</text>
 ${ex.map(x=>`<g><circle cx="${x}" cy="${ey}" r="27" fill="#fff" stroke="#222230" stroke-width="5"/><circle class="pupil" cx="${x+3}" cy="${ey+4}" r="12" fill="#222230"/><circle cx="${x+7}" cy="${ey-1}" r="4" fill="#fff"/><ellipse class="lid" cx="${x}" cy="${ey}" rx="28" ry="28" fill="${dark}"/></g>`).join('')}
 <g class="mouth-shut"><path d="M120 ${my} Q150 ${my+30} 180 ${my}" fill="#7a1c1c" stroke="#222230" stroke-width="5"/><path d="M132 ${my+3} l8 10 l8 -10 M152 ${my+3} l8 10 l8 -10" fill="#fff" stroke="#fff"/></g>

 </svg>`}
const $=id=>document.getElementById(id);
const LIPS_ALL={
 a:{big:{l:43.4,t:32.1,w:15.6,h:9.9,c:'#f8483c',c2:'#fa4e41'},small:{l:40,t:32.1,w:16.3,h:10.6,c:'#c141c6',c2:'#cd4bdc'}},
 e:{big:{l:38,t:29.5,w:17,h:10.5,c:'#1fb4fa',c2:'#33c3fd'},small:{l:42,t:31.5,w:17.5,h:10,c:'#f26a05',c2:'#fd8a1a'}},
 i:{big:{l:42.5,t:24,w:16.5,h:12,c:'#74c205',c2:'#86d414'},small:{l:43.5,t:17.5,w:14,h:9.5,c:'#a516b8',c2:'#b524c8'}},
 o:{big:{l:43,t:25.5,w:15,h:11,c:'#fbb116',c2:'#fdc02e'},small:{l:43.2,t:52.2,w:14.2,h:9.8,c:'#5fd0c0',c2:'#6adbcb'}},
 u:{big:{l:41.5,t:63.5,w:17,h:12.5,c:'#f4128e',c2:'#fa2a9e'},small:{l:41.9,t:68.2,w:15.3,h:11.8,c:'#2352e6',c2:'#2c5cf0'}}};
if(L==='e')document.body.classList.add('lc-short');const HASIMG=!!LIPS_ALL[L];const LIPS=LIPS_ALL[L]||{};

$('big').innerHTML=pic('big',L.toUpperCase(),COLS.big);$('small').innerHTML=pic('small',L,COLS.small);
$('h').textContent=F?`Meet the letter ${L} and the bossy e! Tap me!`:`Meet the letter ${L}! Tap me!`;
let IMAP={};fetch('../games/img/map.json').then(r=>r.json()).catch(()=>({})).then(m=>{IMAP=m;$('wimg').onerror=()=>{$('wimg').onerror=null;$('wimg').src='../games/img/'+(IMAP[W]||W+'.svg')};$('wimg').src=CH+'img/'+W+'.png'});$('wtxt').innerHTML=[...W].map((c,k)=>(c===L||(F&&k===W.length-1&&c==='e'))?'<b>'+c+'</b>':c).join('');
let n=0,cur=null;const wait=ms=>new Promise(r=>setTimeout(r,ms));
let AC2=null,AN=null,amp=0;
function play(src){return new Promise(r=>{if(cur)cur.pause();const a=new Audio(src);cur=a;
 try{if(!src.startsWith('http')){AC2=AC2||new (window.AudioContext||window.webkitAudioContext)();if(AC2.state==='suspended')AC2.resume();if(!AN){AN=AC2.createAnalyser();AN.fftSize=512;AN.connect(AC2.destination)}AC2.createMediaElementSource(a).connect(AN)}}catch(e){}
 a.onended=a.onerror=()=>{amp=0;r()};a.play().catch(()=>{amp=0;r()})})}
const buf=new Uint8Array(512);let tick=0;
(function loop(){tick++;if(AN&&cur&&!cur.paused){AN.getByteTimeDomainData(buf);let s2=0;for(let i=0;i<buf.length;i++){const x=(buf[i]-128)/128;s2+=x*x}amp=Math.sqrt(s2/buf.length)}else amp=0;
 document.querySelectorAll('.talk .mw, .mw.talking').forEach(m=>{const open=AN?amp>0.045:(tick%8<4);m.classList.toggle('shut',!open)});
 document.querySelectorAll('.mw.shut').forEach(m=>{if(!m.closest('.talk'))m.classList.remove('shut')});
 requestAnimationFrame(loop)})();
async function talk(el,src){el.classList.add('talk');await play(src);el.classList.remove('talk')}
function burst(el,ems){const r=el.getBoundingClientRect();for(let k=0;k<8;k++){const s=document.createElement('div');s.className='fly';s.textContent=ems[k%ems.length];s.style.left=(r.left+r.width/2-16)+'px';s.style.top=(r.top+r.height*.35)+'px';s.style.setProperty('--dx',((Math.random()-.5)*300)+'px');s.style.setProperty('--r',((Math.random()-.5)*120)+'deg');document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}
let intro=true,tapBusy=false;

async function sayBoth(src){['big','small'].forEach(id=>$(id).classList.add('talk'));await play(src);['big','small'].forEach(id=>$(id).classList.remove('talk'))}
async function tap(){if(tapBusy)return;
 if(intro){intro=false;tapBusy=true;dance('d1');
  $('say').innerHTML=`Hi! My name is the letter <b>${L.toUpperCase()}</b>, and I make <b>two</b> sounds…`;await sayBoth('call/'+L+'-intro.mp3');
  $('say').innerHTML=`My <b>short</b> sound… 🎵`;dance('d1');burst($('big'),['🎵','✨','⭐']);await sayBoth('../vowels/g-short-'+L+'.mp3');await wait(250);
  $('say').innerHTML=`and…`;await sayBoth('call/and.mp3');
  $('say').innerHTML=F?`my <b>long</b> sound says my name: <b>${L.toUpperCase()}</b>! A bossy <b>e</b> makes it happen! 🎉`:TEAM?`my <b>long</b> sound says my name: <b>${L.toUpperCase()}</b>! Letters can team up to make it! 🎉`:`my <b>long</b> sound says my name: <b>${L.toUpperCase()}</b>! 🎉`;dance('d2');burst($('small'),['🎉','🌟','💃']);await sayBoth('../vowels/g-long-'+L+'.mp3');
  await wait(400);$('say').innerHTML=`👆 Tap me again to hear my sounds!`;tapBusy=false;return}
 const short=n%2===0;n++;dance(short?'d1':'d2');
 sayBoth('../vowels/g-'+(short?'short':'long')+'-'+L+'.mp3');
 if(short){$('say').innerHTML=`My <b>short</b> sound! Like in <b>${EX[0]}</b> 🎵`;burst($('big'),['🎵','✨','⭐'])}
 else{$('say').innerHTML=F?`My <b>long</b> sound! Like in <b>${EX[1]}</b>, or <b>${W}</b> with a bossy <b>e</b> 🎉`:TEAM?`My <b>long</b> sound! Like in <b>${EX[1]}</b>, or <b>${W}</b> 🎉`:`My <b>long</b> sound says my name: <b>${L.toUpperCase()}</b>! 🎉`;burst($('small'),['🎉','🌟','💃'])}}
$('big').onclick=tap;$('small').onclick=tap;
$('word').onclick=e=>{const b=e.currentTarget;b.animate([{transform:'scale(1)'},{transform:'scale(1.12) rotate(-3deg)'},{transform:'scale(1)'}],{duration:400});play('../games/audio/w/'+W+'.mp3');burst(b,['✨','⭐'])};
function setupDemo(cfg){$('bossy').classList.add('on');$('tip').innerHTML=cfg.tip;const PAIRS=cfg.pairs,FOC=cfg.focus||[L];let pi=0,on=false;const AD=cfg.add||'e';
 const mark=(from,to)=>{const f=[...from];let fi=0;return [...to].map(c=>{if(fi<f.length&&c===f[fi]){fi++;return 0}return 1})};
 const showB=()=>{const [a,b]=PAIRS[pi];const w=on?b:a;const mk=on?mark(a,b):null;$('bt').innerHTML=[...w].map((c,k)=>`<div class="tl ${FOC.includes(c)&&!(mk&&mk[k])?'a':''} ${mk&&mk[k]?'e':''}">${c}</div>`).join('');$('badd').textContent=on?cfg.btnOff:cfg.btn};
 $('bnote').innerHTML=cfg.note0;

  if(on){document.querySelectorAll('#bt .tl.a').forEach(x=>x.classList.add('long'));$('bnote').innerHTML=cfg.noteOn;burst($('badd'),['✨','⭐','🪄'])}

 $('bnext').onclick=()=>{pi=(pi+1)%PAIRS.length;on=false;showB();$('bnote').innerHTML=cfg.note0;play('../games/audio/w/'+PAIRS[pi][0]+'.mp3')};
 showB()}
if(F&&!DL){setupDemo({tip:'Tap a monster to hear its <b>short</b> and <b>long</b> sounds. Then add the bossy <b>e</b> and listen to what happens to the word!',pairs:[['cap','cape'],['tap','tape'],['can','cane'],['mad','made'],['hat','hate']],focus:['a'],btn:'➕ Add the bossy e!',btnOff:'↩ Take the e off',

if(DL)fetch('../lessons/'+DL+'.json',{cache:'no-store'}).then(r=>r.json()).then(J=>{const lp=J.letterPage||{};if(lp.ex)EX=lp.ex;

let ac,callId=0,busy=false;
function tone(t0,d,fs,v=.08){ac=ac||new (window.AudioContext||window.webkitAudioContext)();fs.forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.02);g.gain.setValueAtTime(v,t0+d-.02);g.gain.linearRampToValueAtTime(0,t0+d);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d)})}
function ring(rings){ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+.05;for(let r=0;r<rings;r++){tone(t+r*3,.4,[400,450]);tone(t+r*3+.6,.4,[400,450])}return rings*3-1.6}
async function call(){const id=++callId;$('who').textContent='Letter '+L;$('av').innerHTML=pic('small',L,COLS.small);
 $('ov').classList.add('on');$('phone').classList.add('ring');$('av').classList.add('calling');$('st').textContent='Calling…';$('cap').textContent='☎️ Ring ring!';$('k1').disabled=$('k2').disabled=true;
 await wait(ring(2)*1000);if(id!==callId)return;
 $('phone').classList.remove('ring');$('av').classList.remove('calling');$('st').textContent='Connected';
 busy=true;const A=$('av');
 $('cap').innerHTML=`Hi! My name is the letter ${L.toUpperCase()}, and I make two sounds…`;await talk(A,'call/'+L+'-intro.mp3');if(id!==callId)return;
 $('cap').innerHTML=`My short sound… <b style="font-size:28px">${L}</b>`;await talk(A,'../vowels/g-short-'+L+'.mp3');await wait(250);if(id!==callId)return;
 $('cap').innerHTML='and…';await talk(A,'call/and.mp3');if(id!==callId)return;
 $('cap').innerHTML=`my long sound says my name… <b style="font-size:28px">${L.toUpperCase()}</b>!`;await talk(A,'../vowels/g-long-'+L+'.mp3');await wait(400);if(id!==callId)return;
 $('cap').textContent='Press 1 for my short sound, or 2 for my long sound!';await talk(A,'call/press.mp3');busy=false;if(id!==callId)return;
 $('k1').disabled=$('k2').disabled=false}
async function press(k){if(busy)return;busy=true;const b=$('k'+k);b.classList.remove('press');void b.offsetWidth;b.classList.add('press');
 ac=ac||new (window.AudioContext||window.webkitAudioContext)();tone(ac.currentTime,.18,k===1?[697,1209]:[697,1336],.06);await wait(250);
 if(k===1){$('cap').innerHTML=`My short sound… <b style="font-size:28px">${L}</b>`;await talk($('av'),'call/short.mp3');await wait(150);await talk($('av'),'../vowels/g-short-'+L+'.mp3')}
 else{$('cap').innerHTML=`My long sound says my name… <b style="font-size:28px">${L.toUpperCase()}</b>!`;await talk($('av'),'call/long.mp3');await wait(150);await talk($('av'),'../vowels/g-long-'+L+'.mp3')}
 $('cap').textContent="Press 1 or 2 again! Hang up when you're done 📞";busy=false}
async function hang(){const was=$('st').textContent==='Connected';callId++;if(cur)cur.pause();$('k1').disabled=$('k2').disabled=true;
 if(was){$('cap').textContent='Bye for now! Call me again soon! 👋';busy=true;await talk($('av'),'call/all-3.mp3');busy=false}
 $('ov').classList.remove('on');$('phone').classList.remove('ring');$('st').textContent=''}
$('call').onclick=call;$('hang').onclick=hang;$('k1').onclick=()=>press(1);$('k2').onclick=()=>press(2);
</script>
</body>
