<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Which Sound? – Pioneers</title>
<style>
@font-face{font-family:Andika;src:url(../fonts/Andika-Regular.ttf)}
@font-face{font-family:Andika;font-weight:700;src:url(../fonts/Andika-Bold.ttf)}
:root{--o:#f47817;--t:#68ccd1;--ink:#222230;--ok:#3a9d3a;--v:#e8231f;--p:#7c4dff;--A:#1d9bd1;--B:#e0457b}
*{box-sizing:border-box}
body{margin:0;font-family:Andika,"Segoe UI",sans-serif;color:var(--ink);background:#fff8f0;text-align:center}
.wrap{max-width:980px;margin:0 auto;padding:10px 12px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:999px;padding:8px 16px;background:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.tabs button.on{background:var(--o);color:#fff}
.pane{display:none}.pane.on{display:block}
.mouths{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.mouth{flex:1 1 260px;max-width:420px;border-radius:22px;padding:10px 14px;color:#fff;cursor:pointer;border:0;font:inherit;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.mouth b{font-size:56px;line-height:1;display:block}
.mouth span{font-size:16px}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.pair{background:#fff;border-radius:20px;padding:10px;box-shadow:0 4px 12px rgba(0,0,0,.07);display:flex;justify-content:space-around;align-items:center}
.wd{border:0;background:none;font:inherit;font-weight:700;font-size:min(40px,8vw);cursor:pointer;padding:4px 10px;border-radius:14px}
.wd:hover{background:#f6f3ff}
.wd .va{color:var(--A)}.wd .vb{color:var(--B)}
.wd.say{animation:pp .5s}@keyframes pp{50%{transform:scale(1.15)}}
.vs{color:#bbb;font-weight:700}
.big{font-size:min(26px,5vw);font-weight:700;margin:10px 0}
.ear{border:0;border-radius:50%;width:110px;height:110px;font-size:54px;background:var(--t);color:#fff;cursor:pointer;box-shadow:0 5px 0 #3fa3a8}
.choices{display:flex;gap:18px;justify-content:center;margin-top:14px}
.ch{border:0;border-radius:26px;width:150px;height:130px;font:inherit;font-weight:700;font-size:72px;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.ch small{display:block;font-size:15px}
.ok{animation:pp .45s;outline:6px solid #8fd18f}
.no{animation:sh .45s}@keyframes sh{20%{transform:translateX(-8px)}60%{transform:translateX(8px)}}
.prog{font-size:22px;letter-spacing:3px;margin-top:10px}.prog span{opacity:.2}.prog span.on{opacity:1}
.msg{font-size:20px;font-weight:700;min-height:30px;margin-top:8px}
.rp{display:flex;gap:16px;justify-content:center;margin:14px 0}
.rp button{border:0;background:#fff;border-radius:20px;padding:12px 26px;font:inherit;font-weight:700;font-size:min(44px,9vw);cursor:pointer;box-shadow:0 5px 0 #ddd}
.btn{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:999px;padding:9px 22px;cursor:pointer;color:#fff;background:var(--o);box-shadow:0 4px 0 #c85d0b;margin-top:10px}
.conf{position:fixed;top:-20px;font-size:28px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="wrap">
 <div class="tabs"><button class="on" data-p="1">👄 Compare</button><button data-p="2">👂 Listen &amp; choose</button><button data-p="3">📖 Read &amp; pick</button></div>
 <div class="pane on" id="p1">
  <div class="mouths" id="mouths"></div>
  <div class="pairs" id="pairs"></div>
  <p style="font-size:15px;color:#777" id="cnote">Tap a word to hear it. Only the middle letter changes, and it changes the whole word!</p>
 </div>
 <div class="pane" id="p2">
  <div class="big" id="lq">Listen to the word. Which sound do you hear?</div>
  <button class="ear" id="ear">👂</button>
  <div class="choices" id="lch"></div>
  <div class="msg" id="lmsg"></div><div class="prog" id="lprog"></div>
 </div>
 <div class="pane" id="p3">
  <div class="big" id="rq"></div>
  <div class="rp" id="rp"></div>
  <div class="msg" id="rmsg"></div><div class="prog" id="rprog"></div>
 </div>
</div>
<script>
const P=new URLSearchParams(location.search);const LID=P.get('l')||'short-e';
const $=id=>document.getElementById(id);
let cur=null;function play(src){return new Promise(r=>{if(cur)cur.pause();cur=new Audio(src);cur.onended=cur.onerror=r;cur.play().catch(r)})}
const W=w=>play('../games/audio/w/'+w+'.mp3');const wait=ms=>new Promise(r=>setTimeout(r,ms));
let ac;function beep(f,d,type='triangle',v=.12){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function confetti(){const em=['🎉','⭐','🎊','✨','🌟'];for(let k=0;k<36;k++){const s=document.createElement('div');s.className='conf';s.textContent=em[k%em.length];s.style.left=Math.random()*100+'vw';s.style.animationDuration=(1.5+Math.random()*1.5)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3400)}}
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p'+b.dataset.p))});
if(P.get('tab'))setTimeout(()=>document.querySelector(`.tabs button[data-p="${P.get('tab')}"]`)?.click(),0);
fetch('../lessons/'+LID+'.json',{cache:'no-store'}).then(r=>r.json()).then(J=>{const C=(P.get('k')==='2'&&J.contrast2)||J.contrast,A=C.a,B=C.b,LET=J.letter;
 // Long-vowel lessons (e.g. a_e) set labels/names/sounds explicitly; short-vowel lessons use the defaults below.
 const AL=C.aLabel||A,BL=C.bLabel||B,AN=C.aName||('short '+A),BN=C.bName||('short '+B);
 const ASND=C.aSound||`../vowels/g-short-${A}.mp3`,BSND=C.bSound||`../vowels/g-short-${B}.mp3`;
 const col=v=>v===A?'var(--A)':'var(--B)';
 const hl=(w,isB)=>(C.hlA||C.hlB)?(()=>{const re=isB?C.hlB:C.hlA;return re?w.replace(new RegExp(re,'g'),m=>`<span class="${isB?'vb':'va'}">${m}</span>`):w})():C.split?(isB?[...w].map((ch,k)=>(ch===LET||(k===w.length-1&&ch==='e'))?`<span class="vb">${ch}</span>`:ch).join(''):[...w].map(ch=>ch===LET?`<span class="va">${ch}</span>`:ch).join('')):[...w].map(ch=>ch===A?`<span class="va">${ch}</span>`:ch===B?`<span class="vb">${ch}</span>`:ch).join('');
 $('mouths').innerHTML=[[A,AL,AN,C.amouth,ASND],[B,BL,BN,C.bmouth,BSND]].map(([v,L,N,m,sn])=>`<button class="mouth" data-s="${sn}" style="background:${col(v)}"><b>${L}</b><span>${(C.split||C.hlA)?N:'/'+v+'/'} – ${m}</span></button>`).join('');
 document.querySelectorAll('.mouth').forEach(b=>b.onclick=()=>play(b.dataset.s));
 if(C.split)$('pairs').style.gridTemplateColumns='repeat(auto-fit,minmax(270px,1fr))';
 $('pairs').innerHTML=C.pairs.map(([x,y])=>`<div class="pair"><button class="wd" data-w="${x}">${hl(x,0)}</button><span class="vs">or</span><button class="wd" data-w="${y}">${hl(y,1)}</button></div>`).join('');
 document.querySelectorAll('.wd').forEach(b=>b.onclick=()=>{b.classList.remove('say');void b.offsetWidth;b.classList.add('say');W(b.dataset.w)});
 // listen
 const isBw=w=>C.bset?C.bset.includes(w):C.split?new RegExp(LET+'[^aeiou]e$').test(w):(w.includes(B)&&!w.includes(A));const vowelOf=w=>isBw(w)?B:A;let LQ=shuf(C.listen),li=0,lock=false;
 $('lch').innerHTML=[[A,AL],[B,BL]].map(([v,L],k)=>`<button class="ch" data-v="${v}" style="background:${col(v)};${L.length>2?'font-size:56px':''}">${L}<small>${k?'2 fingers':'1 finger'}</small></button>`).join('');
 $('lprog').innerHTML=LQ.map(()=>'<span>⭐</span>').join('');
 if(C.lq)$('lq').textContent=C.lq;else if(C.split)$('lq').textContent=`Listen to the word. Is the ${LET} short or long?`;
 const lplay=()=>W(LQ[li]);$('ear').onclick=lplay;
 document.querySelectorAll('.ch').forEach(b=>b.onclick=async()=>{if(lock||li>=LQ.length)return;const w=LQ[li];
  if(b.dataset.v===vowelOf(w)){lock=true;b.classList.add('ok');beep(660,.1);setTimeout(()=>beep(880,.12),90);$('lprog').children[li].classList.add('on');$('lmsg').textContent=`Yes! "${w}" has the ${b.dataset.v===A?AN:BN}! ⭐`;await wait(1100);b.classList.remove('ok');li++;lock=false;
   if(li<LQ.length){$('lmsg').textContent='';lplay()}else{$('lmsg').textContent='You did it! Super listening! 🎉';confetti()}}
  else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');beep(200,.2,'sawtooth',.05);$('lmsg').textContent=C.wrongListen||(C.split?'Listen again… is there a bossy e on the end? 👂':'Listen again… watch the mouth: big or small? 👂');await wait(500);lplay()}});
 // read
 let ri=0;$('rq').textContent=C.rq||`Which word has the ${BN}?`;$('rprog').innerHTML=C.read.map(()=>'<span>⭐</span>').join('');
 const rshow=()=>{const pr=C.read[ri];$('rp').innerHTML=shuf(pr).map(w=>`<button data-w="${w}">${w}</button>`).join('');
  document.querySelectorAll('#rp button').forEach(b=>b.onclick=async()=>{if(b.dataset.w===pr[1]){b.classList.add('ok');beep(660,.1);setTimeout(()=>beep(880,.12),90);$('rprog').children[ri].classList.add('on');$('rmsg').textContent=`Yes! ${pr[1]}! ⭐`;await W(pr[1]);await wait(400);ri++;
    if(ri<C.read.length){$('rmsg').textContent='';rshow()}else{$('rmsg').textContent='You can read them all! 🎉';$('rp').innerHTML='';confetti()}}
   else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');beep(200,.2,'sawtooth',.05);$('rmsg').textContent=C.wrongRead||(C.split?'Look at the end of the word. Is there a bossy e?':`Look at the middle letter. Is it ${A} or ${B}?`)}})};
 rshow();if(C.note)$('cnote').textContent=C.note});
</script>
</body>
</html>
