<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Decodable Reader – Pioneers</title>
<style>
@font-face{font-family:Andika;src:url(../fonts/Andika-Regular.ttf)}
@font-face{font-family:Andika;font-weight:700;src:url(../fonts/Andika-Bold.ttf)}
:root{--o:#f47817;--t:#68ccd1;--ink:#222230;--ok:#3a9d3a;--v:#e8231f;--p:#7c4dff}
*{box-sizing:border-box}
body{margin:0;font-family:Andika,"Segoe UI",sans-serif;color:var(--ink);background:#fff8f0;text-align:center}
.wrap{max-width:1040px;margin:0 auto;padding:8px 10px 14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ttl{font-weight:700;font-size:min(22px,4.6vw);text-align:left}
.lvl{display:inline-block;font-size:13px;color:#fff;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.mode{display:flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.mode button{font:inherit;font-weight:700;font-size:15px;border:0;background:#fff;padding:6px 12px;cursor:pointer}
.mode button.on{background:var(--o);color:#fff}
.book{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12);background:#fff;user-select:none}
.book img{display:block;width:100%}
.book.turn{animation:turn .35s ease}
@keyframes turn{0%{opacity:.3;transform:translateX(30px)}100%{opacity:1;transform:none}}
.w{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;border-radius:6px}
.mode2 .w:hover{background:rgba(255,230,120,.25)}
.w.hl{background:rgba(255,214,10,.55);box-shadow:0 0 0 2px #ffc400}
.w.nope{animation:sh .45s;background:rgba(224,69,123,.2)}
@keyframes sh{20%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
.w.err::after{content:"";position:absolute;left:10%;right:10%;bottom:-3px;height:4px;border-radius:2px;background:#e0457b}
.w.sc::after{content:"";position:absolute;left:10%;right:10%;bottom:-3px;height:4px;border-radius:2px;background:var(--ok)}
.stage{position:relative;padding:0 46px}
.arr{position:absolute;top:50%;transform:translateY(-50%);font:inherit;font-weight:700;font-size:22px;border:0;border-radius:999px;width:52px;height:52px;cursor:pointer;background:var(--o);color:#fff;box-shadow:0 4px 0 #c85d0b;z-index:3}
.arr:disabled{opacity:.25;cursor:default}
#prev{left:-4px}#next{right:-4px}
.pn{font-weight:700;font-size:16px;background:#fff;border-radius:999px;padding:4px 12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.say{font-weight:700;font-size:min(20px,4.4vw);min-height:28px;margin:4px 0}
.tutor{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;background:#fff;border-radius:14px;padding:8px 12px;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tutor b{font-size:18px}
.res{display:none;background:#fff;border-left:6px solid var(--t);border-radius:14px;padding:12px 16px;margin-top:10px;text-align:left;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.res.on{display:block}
.res h3{margin:0 0 6px}
.res .rec{font-size:20px;font-weight:700;margin:6px 0}
textarea{width:100%;min-height:90px;font:inherit;font-size:15px;border:2px dashed #ccd;border-radius:10px;padding:8px}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:999px;padding:8px 18px;cursor:pointer;color:#fff;background:var(--o);box-shadow:0 3px 0 #c85d0b;margin-top:6px}
.btn.alt{background:var(--t);box-shadow:0 3px 0 #3fa3a8}
.conf{position:fixed;top:-20px;font-size:28px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><div class="ttl" id="ttl"></div><span class="pn" id="pn"></span>
    <div class="mode"><button id="m1" class="on">📖 Read 1: fluency</button><button id="m2">🔍 Read 2: find the sound</button></div></div>
  <div class="stage"><button class="arr" id="prev" aria-label="Previous page">◀</button><div class="book" id="book"><img id="img" alt=""></div><button class="arr" id="next" aria-label="Next page">▶</button></div>
  <div class="say" id="say"></div>
  <div class="tutor" id="tbar"></div>
  <div class="res" id="res"><h3>📝 Reading results</h3><div class="rec" id="rec"></div><textarea id="note"></textarea><br><button class="btn" id="copy">📋 Copy for TutorBird</button> <button class="btn alt" id="reset">↺ Start again</button> <span id="ok" style="color:var(--ok);font-weight:700;opacity:0">Copied!</span></div>
</div>
<script>
const P=new URLSearchParams(location.search);const BK=P.get('b')||'pat-and-the-bat';
const $=id=>document.getElementById(id);
let ac;function beep(f,d,type='triangle',v=.12){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function confetti(){const em=['🎉','⭐','🎊','✨','🌟','📚'];for(let k=0;k<36;k++){const s=document.createElement('div');s.className='conf';s.textContent=em[k%em.length];s.style.left=Math.random()*100+'vw';s.style.animationDuration=(1.6+Math.random()*1.6)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3600)}}
const norm=t=>t.toLowerCase().replace(/[^a-z']/g,'');
fetch('books/'+BK+'.json',{cache:'no-store'}).then(r=>r.json()).then(go);
function go(B){
 const LC={Emerging:'#3a9d3a',Consolidating:'#f47817',Extending:'#7c4dff'};
 $('ttl').innerHTML=`${B.title}<span class="lvl" style="background:${LC[B.level]||'#888'}">${B.level} ${B.letter}</span>`;
 const isFocus=w=>!!w.f;
 const story=new Set(B.story);
 let pg=0,mode=1;const marks={},found={},plain={};
 // Emerging books print the short a in red; for Read 2 we turn the red letters back to plain ink so the child has to find them.
 function unred(src,words){return new Promise(res=>{const im=new Image();im.onload=()=>{const W=im.naturalWidth,H=im.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(im,0,0);
  const bgD=x.getImageData(4,4,1,1).data,bg=[bgD[0],bgD[1],bgD[2]];
  for(const w of words){const x0=Math.max(0,Math.floor(w.x*W)-3),y0=Math.max(0,Math.floor(w.y*H)-3),x1=Math.min(W,Math.ceil((w.x+w.w)*W)+3),y1=Math.min(H,Math.ceil((w.y+w.h)*H)+3);if(x1<=x0||y1<=y0)continue;
   const D=x.getImageData(x0,y0,x1-x0,y1-y0),d=D.data;let ink=[34,34,48],n=0,a=[0,0,0];
   for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];if(r<110&&g<110&&b<120&&Math.abs(r-g)<30){a[0]+=r;a[1]+=g;a[2]+=b;n++}}
   if(n>20)ink=a.map(v=>v/n);
   for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];if(r-(g+b)/2>35&&r>110){const al=Math.max(0,Math.min(1,(bg[1]-g)/(bg[1]-40)));for(let k=0;k<3;k++)d[i+k]=bg[k]*(1-al)+ink[k]*al}}
   x.putImageData(D,x0,y0)}
  res(c.toDataURL('image/jpeg',.85))};im.onerror=()=>res(src);im.src=src})}
 function render(){const p=B.pages[pg];const bk=$('book');bk.classList.remove('turn');void bk.offsetWidth;bk.classList.add('turn');bk.classList.toggle('mode2',mode===2);
  const src='books/'+BK+'/'+p.img;const want=mode===2&&B.level==='Emerging'&&story.has(pg);$('img').src=want&&plain[pg]?plain[pg]:src;if(want&&!plain[pg]){const k=pg;unred(src,p.words).then(u=>{plain[k]=u;if(pg===k&&mode===2)$('img').src=u})}bk.querySelectorAll('.w').forEach(x=>x.remove());
  p.words.forEach((w,i)=>{const b=document.createElement('button');b.className='w';Object.assign(b.style,{left:(w.x*100-.5)+'%',top:(w.y*100-.6)+'%',width:(w.w*100+1.4)+'%',height:(w.h*100+1.2)+'%'});
   const key=pg+':'+i;if(marks[key])b.classList.add(marks[key]);if(found[key])b.classList.add('hl');
   b.onclick=()=>tap(b,w,key);bk.appendChild(b)});
  $('pn').textContent=`${pg+1} / ${B.pages.length}`;$('prev').disabled=pg===0;$('next').disabled=pg===B.pages.length-1;
  $('say').textContent=mode===2&&story.has(pg)?`Find the ${B.focusName} words! ${pageCount()}`:(story.has(pg)?'':'');
  bar();if(pg>Math.max(...B.story))results();else $("res").classList.remove("on")}
 function pageCount(){const p=B.pages[pg];const tot=p.words.filter(w=>isFocus(w)).length;const f=p.words.filter((w,i)=>found[pg+':'+i]).length;return tot?`(${f} of ${tot} found)`:''}
 function tap(b,w,key){
  if(mode===1){if(!story.has(pg))return;const s=marks[key];const nx=!s?'err':s==='err'?'sc':'';b.classList.remove('err','sc');if(nx)b.classList.add(nx);if(nx)marks[key]=nx;else delete marks[key];bar();return}
  if(!story.has(pg))return;
  if(found[key])return;
  if(isFocus(w)){found[key]=1;b.classList.add('hl');beep(660,.1);setTimeout(()=>beep(880,.12),80);
   const p=B.pages[pg];const tot=p.words.filter(x=>isFocus(x)).length;const f=p.words.filter((x,i)=>found[pg+':'+i]).length;
   $('say').textContent=f===tot?`⭐ You found all ${tot} on this page!`:`Yes! "${norm(w.t)}" has the ${B.focusName} sound! (${f} of ${tot})`;if(f===tot){beep(1046,.2)}bar();const S=stats();if(S.focusFound===S.focusTot){confetti();new Audio(B.akey?`audio/allfound-${B.akey}.mp3`:B.focus==='a'?'audio/allfound.mp3':`audio/allfound-${B.focus}.mp3`).play().catch(()=>{})}}
  else{b.classList.add('nope');setTimeout(()=>b.classList.remove('nope'),450);beep(220,.15,'sawtooth',.05);$('say').textContent=`Hmm, can you hear the ${B.focusName} sound in "${norm(w.t)}"? Look again! 👀`}}
 function stats(){let words=0,focusTot=0,focusFound=0;B.pages.forEach((p,pi)=>{if(!story.has(pi))return;words+=p.words.length;p.words.forEach((w,i)=>{if(isFocus(w)){focusTot++;if(found[pi+':'+i])focusFound++}})});
  const err=Object.values(marks).filter(v=>v==='err').length,sc=Object.values(marks).filter(v=>v==='sc').length;const acc=words?Math.round((words-err)/words*1000)/10:0;return {words,err,sc,acc,focusTot,focusFound}}
 function bar(){const s=stats();$('tbar').innerHTML=mode===1?`<span>Tutor (Read 1): tap a word the child misreads → <span style="color:#e0457b">pink</span>. Tap again if they self-correct → <span style="color:var(--ok)">green</span>.</span><span>Errors <b>${s.err}</b> · Self-corrections <b>${s.sc}</b> · Accuracy <b>${s.acc}%</b></span>`:`<span>Read 2: sentence by sentence, find every word with the <b>${B.focusName}</b> sound and tap it.</span><span>Found <b>${s.focusFound}</b> of ${s.focusTot}</span>`}
 function results(){const s=stats();let rec,col;if(s.err===0&&s.sc===0&&!Object.keys(found).length){$('res').classList.add('on');$('rec').textContent='Mark errors in Read 1 (and find the sound in Read 2) to see the results here.';$('note').value='';return}
  if(s.acc>=95){rec=`${s.acc}% accuracy: ready to move up a level 🚀 (if their pace is good)`}else if(s.acc>=90){rec=`${s.acc}% accuracy: just right (instructional level) 👍`}else{rec=`${s.acc}% accuracy: try an easier book (under 90%) 💛`}
  $('rec').textContent=rec;$('res').classList.add('on');
  $('note').value=`Read "${B.title}" (Decodable ${B.letter}, ${B.level}). Read 1: ${s.acc}% accuracy (${s.err} error${s.err===1?'':'s'} in ${s.words} words), ${s.sc} self-correction${s.sc===1?'':'s'}. Read 2: found ${s.focusFound} of ${s.focusTot} ${B.focusName} words. ${s.acc>=95?'Ready to move up a level.':s.acc>=90?'Stay at this level.':'Try an easier level next time.'}`;
  if(s.focusFound===s.focusTot&&s.focusTot)confetti()}
 $('m1').onclick=()=>{mode=1;$('m1').classList.add('on');$('m2').classList.remove('on');render()};
 $('m2').onclick=()=>{mode=2;pg=0;$('m2').classList.add('on');$('m1').classList.remove('on');render()};
 $('prev').onclick=()=>{if(pg>0){pg--;render()}};$('next').onclick=()=>{if(pg<B.pages.length-1){pg++;render()}};
 document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});
 $('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('note').value)}catch(e){$('note').select();document.execCommand('copy')}$('ok').style.opacity=1;setTimeout(()=>$('ok').style.opacity=0,2000)};
 $('reset').onclick=()=>{for(const k in marks)delete marks[k];for(const k in found)delete found[k];pg=0;mode=1;$('m1').click();$('res').classList.remove('on')};
 if(P.get('p'))pg=+P.get('p')-1;if(P.get('m')==='2'){$('m2').click()}else render();
 if(P.get('demo'))document.querySelectorAll('.w').forEach((b,i)=>{if(i%3==0)b.click()})}
</script>
</body>
</html>
